name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$archive"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$archive" | sha256sum --check
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src tools/make_fixture.zig

      - name: Check shell scripts
        run: shellcheck tools/*.sh

      - name: Run debug tests, including allocation-failure leak checks
        run: zig build test

      - name: Run ReleaseSafe tests
        run: zig build test -Doptimize=ReleaseSafe

      - name: Build static release binaries
        run: zig build release -Dversion=0.1.0-ci

      - name: Verify static linkage
        shell: bash
        run: |
          set -euo pipefail
          for binary in zig-out/bin/udmesg-linux-amd64 zig-out/bin/udmesg-linux-arm64; do
            file "$binary" | tee /dev/stderr | grep -q 'statically linked'
            ! readelf --program-headers "$binary" | grep -q 'INTERP'
            ! readelf --dynamic "$binary" 2>/dev/null | grep -q 'NEEDED'
          done
          test "$(zig-out/bin/udmesg-linux-amd64 --version)" = 'udmesg 0.1.0-ci'

      - name: Build and verify Debian packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zig-out/deb
          for arch in amd64 arm64; do
            binary="zig-out/bin/udmesg-linux-$arch"
            deb="zig-out/deb/udmesg_0.1.0_$arch.deb"
            SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) tools/build-deb.sh 0.1.0 "$arch" "$binary" "$deb"
            test "$(dpkg-deb --field "$deb" Package)" = udmesg
            test "$(dpkg-deb --field "$deb" Version)" = 0.1.0
            test "$(dpkg-deb --field "$deb" Architecture)" = "$arch"
            package_root="$RUNNER_TEMP/deb-$arch"
            dpkg-deb --extract "$deb" "$package_root"
            cmp "$binary" "$package_root/usr/bin/udmesg"
            test -x "$package_root/usr/bin/udmesg"
          done

      - name: Benchmark bounded-memory fixture
        shell: bash
        run: |
          set -euo pipefail
          output=$(zig build bench)
          printf '%s\n' "$output"
          {
            echo '## udmesg benchmark'
            echo '```text'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload static binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: udmesg-linux-ci
          path: |
            zig-out/bin/udmesg-linux-amd64
            zig-out/bin/udmesg-linux-arm64
            zig-out/deb/udmesg_0.1.0_amd64.deb
            zig-out/deb/udmesg_0.1.0_arm64.deb
