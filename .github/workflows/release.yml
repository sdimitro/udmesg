name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require vMAJOR.MINOR.PATCH
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $TAG (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset_arch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux-musl
            asset_arch: amd64
          - target: aarch64-linux-musl
            asset_arch: arm64
    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$archive"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$archive" | sha256sum --check
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build static binary
        run: >-
          zig build
          -Dtarget=${{ matrix.target }}
          -Doptimize=ReleaseSmall
          -Dversion=${{ needs.validate.outputs.version }}

      - name: Stage and verify assets
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          asset="udmesg-linux-$ARCH"
          deb="udmesg_${VERSION}_${ARCH}.deb"
          install -m 0755 zig-out/bin/udmesg "$asset"
          file "$asset" | tee /dev/stderr | grep -q 'statically linked'
          ! readelf --program-headers "$asset" | grep -q 'INTERP'
          ! readelf --dynamic "$asset" 2>/dev/null | grep -q 'NEEDED'
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) tools/build-deb.sh "$VERSION" "$ARCH" "$asset" "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = udmesg
          test "$(dpkg-deb --field "$deb" Version)" = "$VERSION"
          test "$(dpkg-deb --field "$deb" Architecture)" = "$ARCH"
          package_root="$RUNNER_TEMP/package-$ARCH"
          dpkg-deb --extract "$deb" "$package_root"
          cmp "$asset" "$package_root/usr/bin/udmesg"
          test -x "$package_root/usr/bin/udmesg"
          test -f "$package_root/usr/share/doc/udmesg/copyright"
          sha256sum "$asset" > "$asset.sha256"
          sha256sum "$deb" > "$deb.sha256"

      - name: Upload architecture artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: udmesg-linux-${{ matrix.asset_arch }}
          path: |
            udmesg-linux-${{ matrix.asset_arch }}
            udmesg-linux-${{ matrix.asset_arch }}.sha256
            udmesg_${{ needs.validate.outputs.version }}_${{ matrix.asset_arch }}.deb
            udmesg_${{ needs.validate.outputs.version }}_${{ matrix.asset_arch }}.deb.sha256

  release:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: udmesg-linux-*
          path: release-assets
          merge-multiple: true

      - name: Create or repair release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            release-assets/udmesg-linux-amd64
            release-assets/udmesg-linux-amd64.sha256
            release-assets/udmesg-linux-arm64
            release-assets/udmesg-linux-arm64.sha256
            "release-assets/udmesg_${VERSION}_amd64.deb"
            "release-assets/udmesg_${VERSION}_amd64.deb.sha256"
            "release-assets/udmesg_${VERSION}_arm64.deb"
            "release-assets/udmesg_${VERSION}_arm64.deb.sha256"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "missing release asset: $asset" >&2; exit 1; }
          done
          (cd release-assets && sha256sum --check ./*.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --generate-notes --title "$TAG"
          fi
